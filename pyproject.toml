[project]
name = "nyaya-ai"
version = "1.0.0"
description = "AI-powered legal document information assistant"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141,<1",
    "uvicorn[standard]>=0.35,<1",
    "python-multipart>=0.0.20,<1",
    "openai>=1.100,<2",
    "pypdf>=6,<7",
    "python-docx>=1.2,<2",
    "scikit-learn>=1.7,<2",
    "python-dotenv>=1.1,<2",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["."]
