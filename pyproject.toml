
[project]
name = "nyaya-ai"
version = "0.1.0"
description = "AI-powered legal document assistant"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "python-multipart",
    "openai",
    "pypdf",
    "python-docx",
    "scikit-learn",
    "python-dotenv",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["."]